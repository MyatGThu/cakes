<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Chocolate chip cookies, flat illustration">
  <!-- paper shadow -->
  <g fill="#e9ddcc">
    <circle cx="164" cy="268" r="62"/>
    <circle cx="176" cy="226" r="58"/>
    <circle cx="162" cy="186" r="55"/>
    <circle cx="269" cy="278" r="52"/>
    <rect x="66" y="330" width="284" height="12" rx="6"/>
  </g>
  <!-- plate -->
  <rect x="54" y="320" width="284" height="12" rx="6" fill="#241a14"/>
  <!-- cookie stack, bottom to top -->
  <circle cx="152" cy="258" r="62" fill="#d9a94e"/>
  <circle cx="164" cy="216" r="58" fill="#d9a94e"/>
  <circle cx="150" cy="176" r="55" fill="#d9a94e"/>
  <!-- leaning cookie beside the stack -->
  <circle cx="257" cy="268" r="52" fill="#d9a94e"/>
  <!-- chocolate chips -->
  <g fill="#2e1a0c">
    <!-- top cookie face -->
    <circle cx="130" cy="162" r="6"/>
    <circle cx="158" cy="150" r="5"/>
    <circle cx="176" cy="172" r="6"/>
    <circle cx="142" cy="192" r="5"/>
    <circle cx="166" cy="200" r="6"/>
    <circle cx="120" cy="185" r="5"/>
    <!-- middle cookie face -->
    <circle cx="204" cy="210" r="6"/>
    <circle cx="196" cy="240" r="5"/>
    <circle cx="168" cy="252" r="6"/>
    <circle cx="140" cy="254" r="5"/>
    <circle cx="120" cy="236" r="6"/>
    <!-- bottom cookie face -->
    <circle cx="100" cy="258" r="5"/>
    <circle cx="108" cy="282" r="6"/>
    <circle cx="134" cy="296" r="5"/>
    <circle cx="162" cy="300" r="6"/>
    <circle cx="188" cy="288" r="5"/>
    <!-- leaning cookie face -->
    <circle cx="240" cy="250" r="6"/>
    <circle cx="268" cy="242" r="5"/>
    <circle cx="284" cy="268" r="6"/>
    <circle cx="262" cy="290" r="5"/>
    <circle cx="236" cy="284" r="6"/>
    <circle cx="278" cy="296" r="5"/>
  </g>
</svg>
