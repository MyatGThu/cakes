<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Three-tier celebration cake with candles, flat illustration">
  <!-- paper shadow -->
  <g fill="#e9ddcc">
    <rect x="82" y="264" width="252" height="90" rx="14"/>
    <rect x="116" y="186" width="184" height="78" rx="12"/>
    <rect x="148" y="118" width="120" height="68" rx="10"/>
    <rect x="62" y="354" width="292" height="12" rx="6"/>
  </g>
  <!-- plate -->
  <rect x="50" y="344" width="292" height="12" rx="6" fill="#241a14"/>
  <!-- bottom tier -->
  <rect x="70" y="254" width="252" height="90" rx="14" fill="#f6ecdc"/>
  <!-- middle tier -->
  <rect x="104" y="176" width="184" height="78" rx="12" fill="#f3d7de"/>
  <!-- top tier -->
  <rect x="136" y="108" width="120" height="68" rx="10" fill="#f6ecdc"/>
  <!-- raspberry drip, top tier only -->
  <path d="M136 118 h120 v8 q-12 21 -24 0 q-12 21 -24 0 q-12 21 -24 0 q-12 21 -24 0 q-12 18 -24 0 z" fill="#b03052"/>
  <!-- candles -->
  <rect x="164" y="64" width="8" height="46" rx="4" fill="#f3d7de"/>
  <rect x="192" y="58" width="8" height="52" rx="4" fill="#d9a94e"/>
  <rect x="220" y="64" width="8" height="46" rx="4" fill="#f6ecdc"/>
  <!-- flames -->
  <g fill="#d9a94e">
    <ellipse cx="168" cy="52" rx="5" ry="8"/>
    <ellipse cx="196" cy="45" rx="5" ry="8"/>
    <ellipse cx="224" cy="52" rx="5" ry="8"/>
  </g>
  <!-- gold dragées on middle tier -->
  <g fill="#d9a94e">
    <circle cx="132" cy="216" r="7"/>
    <circle cx="175" cy="230" r="7"/>
    <circle cx="217" cy="216" r="7"/>
    <circle cx="260" cy="230" r="7"/>
  </g>
</svg>
