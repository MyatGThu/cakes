  <circle cx="156" cy="274" r="68" fill="#d9a94e"/>
  <!-- middle cookie -->
  <circle cx="144" cy="208" r="68" fill="#a87d2e"/>
  <circle cx="140" cy="200" r="68" fill="#d9a94e"/>
  <!-- top cookie -->
  <circle cx="164" cy="134" r="68" fill="#a87d2e"/>
  <circle cx="160" cy="126" r="68" fill="#d9a94e"/>
  <!-- cookie leaning against the stack -->
  <circle cx="280" cy="272" r="70" fill="#a87d2e"/>
  <circle cx="276" cy="264" r="70" fill="#d9a94e"/>
  <!-- chips: top cookie face -->
  <g fill="#2e1a0c">
    <circle cx="132" cy="98" r="7"/><circle cx="182" cy="94" r="7"/><circle cx="158" cy="132" r="7"/>
    <circle cx="118" cy="142" r="7"/><circle cx="196" cy="140" r="7"/><circle cx="166" cy="170" r="7"/>
  </g>
  <!-- chips: middle cookie face -->
  <g fill="#2e1a0c">
    <circle cx="96" cy="218" r="7"/><circle cx="132" cy="230" r="7"/><circle cx="172" cy="220" r="7"/>
    <circle cx="114" cy="250" r="7"/><circle cx="152" cy="254" r="7"/><circle cx="182" cy="238" r="7"/>
  </g>
  <!-- chips: bottom cookie face -->
  <g fill="#2e1a0c">
    <circle cx="110" cy="296" r="7"/><circle cx="150" cy="310" r="7"/><circle cx="192" cy="296" r="7"/>
    <circle cx="124" cy="316" r="7"/><circle cx="176" cy="318" r="7"/>
  </g>
