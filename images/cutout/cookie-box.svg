<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Stack of chocolate chip cookies, magazine cutout">
  <!-- print shadow -->
  <path d="M89 124 L167 56 L233 91 L242 130 L289 188 L351 238 L363 273 L359 315 L362 345 L356 363 L133 364 L61 365 L41 356 L43 335 L59 289 L67 221 L79 159 Z" fill="#d9cbb6"/>
  <!-- sticker rim (hand-cut, ragged) -->
