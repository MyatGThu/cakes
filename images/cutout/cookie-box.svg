    <circle cx="248" cy="236" r="7"/><circle cx="298" cy="232" r="7"/><circle cx="270" cy="276" r="7"/>
    <circle cx="236" cy="282" r="7"/><circle cx="304" cy="276" r="7"/><circle cx="280" cy="312" r="7"/>
