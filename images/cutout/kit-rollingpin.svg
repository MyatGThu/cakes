    <g fill="#a87d2e">
      <circle cx="142" cy="217" r="3"/><circle cx="160" cy="220" r="2.5"/>
      <circle cx="178" cy="217" r="3"/><circle cx="196" cy="220" r="2.5"/>
      <circle cx="214" cy="217" r="3"/><circle cx="232" cy="220" r="2.5"/>
      <circle cx="250" cy="217" r="3"/><circle cx="266" cy="219" r="2.5"/>
